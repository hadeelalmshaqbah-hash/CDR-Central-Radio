
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDR Central Radio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #101010;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 90%;
    max-width: 900px;
    padding: 40px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 20px;
}

.logo {
    color: #d6ad60;
    letter-spacing: 5px;
    font-size: 14px;
    text-align: center;
}

h1 {
    text-align: center;
    margin-top: 15px;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-top: 10px;
}

.live {
    color: #d6ad60;
    text-align: center;
    margin: 30px 0;
    letter-spacing: 3px;
}

.visualizer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    height: 100px;
}

.visualizer span {
    width: 8px;
    height: 35px;
    background: #d6ad60;
    border-radius: 10px;
    animation: wave 1s infinite alternate;
}

.visualizer span:nth-child(2n) {
    animation-delay: .3s;
}
.visualizer span:nth-child(3n) {
    animation-delay: .6s;
}

@keyframes wave {
    from { height: 15px; }
    to { height: 75px; }
}

.player {
    text-align: center;
    margin-top: 25px;
}

.song {
    color: #d6ad60;
    font-size: 20px;
    margin-bottom: 10px;
}

.description {
    color: #999;
    font-size: 14px;
}

.play-button {
    margin-top: 30px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: none;
    background: #d6ad60;
    color: #111;
    font-size: 26px;
    cursor: pointer;
}

.status {
    margin-top: 20px;
    color: #777;
    font-size: 13px;
}

.footer {
    text-align: center;
    border-top: 1px solid #333;
    margin-top: 40px;
    padding-top: 20px;
    color: #777;
    font-size: 12px;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">CDR GROUP</div>

    <h1>Central Radio</h1>

    <p class="subtitle">
        One Station · All Branches · One Experience
    </p>

    <div class="live">● CENTRAL RADIO SYSTEM</div>

    <div class="visualizer">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="player">
        <div class="song">Central Music Stream</div>

        <p class="description">
            Centralized music streaming for all restaurant branches
        </p>

        <button class="play-button" onclick="toggleRadio()" id="playBtn">
            ▶
        </button>

        <p class="status" id="status">
            Radio is ready
        </p>
    </div>

    <div class="footer">
        CDR CENTRAL RADIO · DIGITAL STREAMING
    </div>

</div>

<script>
function toggleRadio() {
    const button = document.getElementById("playBtn");
    const status = document.getElementById("status");

    if (button.innerHTML === "▶") {
        button.innerHTML = "Ⅱ";
        status.innerHTML = "Interface demonstration — stream not connected";
    } else {
        button.innerHTML = "▶";
        status.innerHTML = "Radio is ready";
    }
}
</script>

</body>
</html>
